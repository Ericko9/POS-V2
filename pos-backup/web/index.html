<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Backup</title>
<style>
  :root { color-scheme: light dark; --fg: #16181d; --mut: #6b7280; --line: #e5e7eb; --bg: #fbfbfc; --card: #fff; --ok: #0f7b46; --bad: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8eaed; --mut: #9aa0a6; --line: #2a2d33; --bg: #16181d; --card: #1f2228; --ok: #4ade80; --bad: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 1.25rem 4rem; font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 62rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--mut); font-size: .9rem; margin: 0 0 1.75rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: .6rem; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 1rem; }
  .stat b { display: block; font-size: 1.15rem; font-weight: 600; }
  .stat span { color: var(--mut); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  button { font: inherit; font-weight: 550; padding: .55rem 1.1rem; border-radius: .45rem; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--mut); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--line); }
  th { color: var(--mut); font-weight: 550; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
  td.size, th.size { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .empty { color: var(--mut); padding: 1rem .5rem; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .85em; }
  .row-actions { display: flex; gap: .5rem; justify-content: flex-end; }
  #msg { margin-top: .75rem; font-size: .875rem; color: var(--mut); min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>POS Backup</h1>
  <p class="sub">pg_dump to <span id="db">&hellip;</span> &rarr; gzip &rarr; S3-compatible storage</p>

  <div class="card">
    <div class="stats">
      <div class="stat"><span>Status</span><b id="state">&mdash;</b></div>
      <div class="stat"><span>Last run</span><b id="lastrun">&mdash;</b></div>
      <div class="stat"><span>Last size</span><b id="lastsize">&mdash;</b></div>
      <div class="stat"><span>Stored</span><b id="count">&mdash;</b></div>
    </div>
    <div style="margin-top:1.1rem">
      <button id="run" class="primary">Run backup now</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Backup</th><th>Taken</th><th class="size">Size</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">No backups stored yet.</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB"
                    : n > 1024 ? (n / 1024).toFixed(1) + " kB" : n + " B";
const fmtTime = (s) => s ? new Date(s).toLocaleString() : "—";

async function poll() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("db").textContent = s.database;
    const st = $("state");
    st.textContent = s.running ? "Running" : s.lastRun ? (s.lastOk ? "OK" : "Failed") : "Idle";
    st.className = s.running ? "" : s.lastRun ? (s.lastOk ? "ok" : "bad") : "";
    $("lastrun").textContent = s.lastRun ? new Date(s.lastRun).toLocaleTimeString() : "—";
    $("lastsize").textContent = s.lastSize ? fmtSize(s.lastSize) : "—";
    $("count").textContent = s.backups.length;
    $("run").disabled = s.running;

    $("rows").innerHTML = "";
    $("empty").style.display = s.backups.length ? "none" : "block";
    for (const b of s.backups) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><code>${b.name}</code></td><td>${fmtTime(b.when)}</td>`
        + `<td class="size">${fmtSize(b.size)}</td>`
        + `<td class="row-actions"><button onclick="restore('${b.name}')">Restore</button></td>`;
      $("rows").appendChild(tr);
    }
    if (s.lastErr) $("msg").textContent = "Error: " + s.lastErr;
  } catch (e) {
    $("msg").textContent = "Cannot reach server: " + e.message;
  }
}

async function run() {
  $("run").disabled = true;
  $("msg").textContent = "Backup started…";
  await fetch("/api/backup", { method: "POST" });
  poll();
}

async function restore(name) {
  if (!confirm(`Restore ${name}?\n\nThis overwrites the current database. Its contents are replaced by the backup.`)) return;
  $("msg").textContent = `Restoring ${name}…`;
  await fetch("/api/restore", { method: "POST", body: new URLSearchParams({ name }) });
  poll();
}

$("run").onclick = run;
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
